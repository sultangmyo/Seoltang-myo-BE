# 도커 설정이므로 도커 사용하실때는 로컬 postgreSQL이 5432 포트 사용중이진 않은지 확인하고 올려주세요!
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/sugarcat
    username: sugarcat-user
    password: sugarcat1234
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect