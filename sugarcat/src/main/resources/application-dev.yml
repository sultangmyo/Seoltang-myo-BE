spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sugarcat
    username: postgres
    password: pg1234
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never # schema.sql 처음 초기화는 수동으로

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect