spring:
  application:
    name: sugarcat

  profiles:
    default: local
    group:
      prod:
        - secret
      local:
        - secret

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 100

  cache:
    type: caffeine
    cache-names:
      - onboardingStatus
      - userMe
      - userNotificationSettings
      - catInfo
      - careSchedules
      - dailyInsulinRecords
      - dailyBloodSugarRecords
      - dailyMealRecords
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

server:
  address: 0.0.0.0
  port: 8080