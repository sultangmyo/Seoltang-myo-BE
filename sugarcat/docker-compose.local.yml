services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sugarcat-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ./secrets:/app/secrets:ro
    networks:
      - app-net

  postgres:
    image: postgres:16
    container_name: sugarcat-postgres
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net: